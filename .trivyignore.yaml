# Trivy findings accepted on purpose. Each entry is scoped to the files it
# covers, so the shipped Dockerfile is still held to every rule.
misconfigurations:
  # The node helper end-to-end image stands in for a Proxmox node: it must
  # run sshd as root, and it lives only for one test run (never published).
  - id: DS-0002
    paths:
      - "test/nodee2e/Dockerfile"
    statement: fake PVE node for the e2e test runs sshd as root by design
  - id: DS-0026
    paths:
      - "test/nodee2e/Dockerfile"
    statement: short-lived test container; the test itself checks sshd is up

vulnerabilities:
  # GO-2026-5932 flags the whole golang.org/x/crypto module because its
  # openpgp packages are unmaintained. PBP imports only x/crypto/ssh and
  # ssh/knownhosts; no openpgp package is in the build (go list -deps), and
  # govulncheck reports it as required but not called. The only fix is an
  # untagged commit. Bump x/crypto to the first tagged release after
  # v0.58.0 and drop this entry; it expires so it cannot be forgotten.
  - id: GO-2026-5932
    paths:
      - "go.mod"
    statement: x/crypto/openpgp is not imported; PBP uses only x/crypto/ssh
    expired_at: 2027-02-01
