# SLSA Go builder configuration for .github/workflows/go-ossf-slsa3-publish.yml
# (linux/amd64). Keep it the same build as packaging/build.sh.
version: 1

env:
  - CGO_ENABLED=0
  - GOTOOLCHAIN=local # use exactly the toolchain installed; never switch

flags:
  - -trimpath

goos: linux
goarch: amd64

main: ./cmd/pbp

# Also the run's artifact name: it must differ between the configs.
binary: pbp-{{ .Os }}-{{ .Arch }}

# VERSION comes from the workflow's evaluated-envs.
ldflags:
  - "-s"
  - "-w"
  - "-X main.version={{ .Env.VERSION }}"
