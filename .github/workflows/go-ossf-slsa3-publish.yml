# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow lets you compile your Go project using a SLSA3 compliant builder.
# This workflow will generate a so-called "provenance" file describing the steps
# that were performed to generate the final binary.
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.
#
# It runs on the GitHub mirror only (Gitea Actions uses .gitea/workflows/).
# Edit it on Gitea; see .gitea/README.md for trying a change on GitHub.
#
# It builds pbp the way packaging/build.sh does, for linux/amd64 and
# linux/arm64, with the Go toolchain pinned in go.mod. The binaries and their
# provenance stay on the workflow run as artifacts: they are not uploaded to
# the GitHub release, whose files come from Gitea through
# packaging/mirror-release.sh and must match its signed SHA256SUMS.

name: SLSA go releaser
on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions: read-all

jobs:
  args:
    runs-on: ubuntu-latest
    outputs:
      go-version: ${{ steps.args.outputs.go-version }}
      version: ${{ steps.args.outputs.version }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: args
        run: |
          # The same toolchain the Gitea workflows read from go.mod.
          go=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)
          [ -n "$go" ] || { echo "go.mod has no toolchain line"; exit 1; }
          echo "go-version=$go" >> "$GITHUB_OUTPUT"
          # A tag push gets the release's version, as the Gitea release
          # workflow does; a dispatch gets a describe of the commit.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            v=$(packaging/debversion.sh "$GITHUB_REF_NAME")
          else
            v=$(git describe --tags --always --dirty | sed 's/^v//')
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # Trusted builder.
  build:
    permissions:
      id-token: write # To sign the provenance.
      contents: write # Requested by the builder's release upload job, which upload-assets: false skips.
      actions: read # To read the workflow path.
    needs: args
    strategy:
      matrix:
        arch: [amd64, arm64]
    uses: slsa-framework/slsa-github-generator/.github/workflows/builder_go_slsa3.yml@v2.1.0
    with:
      config-file: .slsa-goreleaser-linux-${{ matrix.arch }}.yml
      go-version: ${{ needs.args.outputs.go-version }}
      upload-assets: false
      private-repository: true # Drop once the mirror is public.
      evaluated-envs: "VERSION:${{ needs.args.outputs.version }}"
