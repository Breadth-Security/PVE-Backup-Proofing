services:
  pbp:
    image: pbp:latest
    build: .
    restart: unless-stopped
    # On SIGTERM the daemon starts no further proofs and gives those in
    # flight up to 10 minutes to finish; then it cancels them, and their
    # teardown and the run's notification can take about 11 minutes more.
    # A shorter period could SIGKILL it mid-teardown and orphan a guest.
    stop_grace_period: 25m
    environment:
      TZ: ${TZ:-Europe/London} # pbp setup writes TZ to .env; drives the cron schedule
    volumes:
      - ./config.yaml:/etc/pbp/config.yaml:ro
      - ./known_hosts:/etc/pbp/known_hosts:ro   # the node's host key (pbp setup writes it)
      - pbp-state:/var/lib/pbp
      - ./logs:/var/log/pbp    # must be writable by uid 65532
    secrets:
      - pve_token
      - pve_ssh_key

secrets:
  pve_token:
    file: ./secrets/pve_token
  # Private key for the node's restricted "pbp" user (config: target.ssh.user: pbp).
  # Its public key lives on the node behind a forced command; it is not a root
  # key. Set up the node first: docs/setup.md.
  pve_ssh_key:
    file: ./secrets/pve_ssh_key

volumes:
  pbp-state:
