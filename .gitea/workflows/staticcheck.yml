name: staticcheck

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Go toolchain
        id: toolchain
        run: |
          v=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)
          [ -n "$v" ] || { echo "go.mod has no toolchain line"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run staticcheck
        run: |
          staticcheck ./...
          staticcheck -tags integration ./...
          staticcheck -tags nodee2e ./...
