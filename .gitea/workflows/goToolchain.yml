name: go-toolchain

# go vet and go test -race on the exact toolchain pinned in go.mod (the
# `toolchain` line), which is also the toolchain the Docker image is built
# with. The Dockerfile runs the same checks, so an image cannot be built from
# code that fails them.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go-toolchain:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local # use exactly the toolchain installed above; never switch
    steps:
      - uses: actions/checkout@v7
      - name: Read pinned Go toolchain
        id: toolchain
        run: |
          v=$(awk '$1 == "toolchain" { sub(/^go/, "", $2); print $2 }' go.mod)
          [ -n "$v" ] || { echo "go.mod has no toolchain line"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
      - name: Check toolchain matches go.mod and Dockerfile
        run: |
          want=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          [ -n "$want" ] || { echo "go.mod has no toolchain line"; exit 1; }
          got=$(go env GOVERSION)
          echo "go.mod toolchain: $want, in use: $got"
          [ "$got" = "$want" ] || { echo "toolchain in use ($got) differs from go.mod ($want)"; exit 1; }
          image=$(awk '/^FROM golang:/ { split($2, a, ":"); print a[2]; exit }' Dockerfile)
          echo "Dockerfile builder: golang:$image"
          [ "go$image" = "$want" ] || { echo "Dockerfile builds with golang:$image, go.mod pins $want"; exit 1; }
      - name: go mod verify
        run: go mod verify
      - name: Version file and tag mapping
        run: |
          packaging/versionfile_test.sh
          packaging/debversion_test.sh
          packaging/postinst_test.sh
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags nodee2e ./...
      - name: go test -race
        run: go test -race -count=1 ./...
