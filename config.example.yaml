# PBP example configuration. pbp setup writes config.yaml from this file, with
# your answers filled in; edit it afterwards with sudoedit. Docker mounts it at
# /etc/pbp/config.yaml; a .deb host reads /etc/pbp/config.yaml.
# Secrets are referenced by file path, never inline.

schedule: "0 2 * * *"          # cron, in the container's TZ (Docker: .env) or the host's; see docs/operating.md
workers: 1                     # default 1

target:
  type: existing-node          # default; future: provisioned-host
  node: pve-node
  api:
    url: https://pve-node.example.lan:8006
    token_id: pbp@pve!proof
    token_secret_file: /run/secrets/pve_token
    tls_fingerprint: "AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89:AB:CD:EF:01:23:45:67:89"  # or ca_file; never skip-verify
    # ca_file: /etc/pbp/pve-ca.pem
  ssh:
    host: pve-node.example.lan
    user: pbp                  # default; the restricted node helper user. root is rejected
                               # (docs/setup.md). The key must be installed on the
                               # node with a forced command, not in root's authorized_keys
    port: 22                   # default
    key_file: /run/secrets/pve_ssh_key
    known_hosts_file: /etc/pbp/known_hosts
  bridge: vmbr99             # operator-created, no ports, no IP; PBP verifies
  vmid_range: [990000, 990049]

sources:
  storages: [pbs-main]         # PBS-type storages visible on the node

selection:                     # by default the newest backup of every guest is proofed
  exclude:                     # guests never proofed; see docs/operating.md
    guests: []                 # VMIDs (104), VM104 / CT104 for one kind, or ranges (900-999)
    tags: []                   # guests whose live or backed-up config has any of these tags

restore:
  storage: local-zfs
  space_margin_percent: 10     # default; 0..100
  boot_timeout: 5m             # default; at least 30s. Durations need a unit (s, m, h)
  probe_timeout: 5m            # default; at least 30s. Bounds all checks inside one booted
                               # guest; a probe cut short is ERROR, never FAILED
  reproof: false
  # max_run_duration: 6h       # no new proof starts after this long (those in progress finish); unset or 0 = no limit; otherwise at least 1s

checks:
  command_timeout: 60s         # default; at least 1s. Bounds each command run inside a guest;
                               # a command that times out fails its check ("check timed out").
                               # Exception: waiting for boot to settle uses probe_timeout instead
  # Units ignored when judging "no failed units", and Windows services ignored
  # when judging "automatic services running". PBP has built-in lists of each
  # (units and services that fail on the isolated proof network, or stop by
  # design; see docs/checks.md); entries here are added to them.
  use_default_ignores: true    # default; false = use only the two lists below
  ignore_units: []             # e.g. [media-sync.service]
  windows_ignore_services: []  # e.g. [Bonjour Service]
  profiles:
    - name: myapp
      unit: "myapp*.service"
      ports: [8080]
      commands: ["curl -sf http://127.0.0.1:8080/health"]
  guests:
    - match: { vmid: 105 }
      services: [postgresql]

notify:
  when: always                 # always | problems

logging:
  dir: /var/log/pbp
  retain_runs: 30              # runs (one folder each); default; at least 1
